name: Feature request
description: An idea to make Bandwise EQ more useful
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: Describe the situation or the problem first, then the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How would you like it to work?
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Other tools that do it well, screenshots, sketches.
